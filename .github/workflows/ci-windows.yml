name: CI Windows

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
    branches: [ main ]

jobs:
  pester-and-catalog:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester v5
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.0.0
          Get-Module Pester -ListAvailable | Select Name,Version

      - name: Run Pester tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0.0
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Output.Verbosity = 'Detailed'
          $config.Run.PassThru = $true
          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -gt 0) { throw "Pester failed: $($result.FailedCount)" }

      - name: Validate catalog.json
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/Validate-Catalog.ps1 -CatalogPath ./catalog/catalog.json
